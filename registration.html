<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Latest compiled and minified CSS -->

<body>
    <div class="container mb-5 border p-5">
        <h4 class="text-center text-success">Student Registration Form</h4>
    </div>
    <form id="myform">
        <div class="mb-5">
            <label> first Name</label>
            <input type="text" class="form-control" id="fname" placeholder="Enter your name">
            <p id="fname_error" class="text-danger"></p>
        </div>
        <div class="mb-5">
            <label> last Name</label>
            <input type="text" class="form-control" id="lname" placeholder="Enter your last name">
            <p id="lname_error" class="text-danger"></p>
        </div>
        <div class="mb-5">
            <label>Username</label>
            <input type="username" class="form-control" id="username" placeholder="b241267">
            <p id="username_error" class="text-danger"></p>
        </div>
        <div class="mb-5">
            <label>password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password">
            <p id="password_error" class="text-danger"></p>
        </div>

        <div class="mb-5">
            <label> email</label>
            <input type="text" class="form-control" id="email" placeholder="email">
            <p id="email_error" class="text-danger"></p>
        </div>
        <div class="mb-5">
            <label>contact</label>
            <input type="text" class="form-control" id="contact" placeholder="contact">
            <p id="contact_error" class="text-danger"></p>
        </div>
        <div class="mb-5">

            <button type="button" class="btn btn-md btn-success w-100"
                onclick="return studentregistration()">submit</button>
            <div class="alert alert-success">
                <p id="success_error"></p>
            </div>
        </div>



<script>
function studentregistration() {
    // Clear previous errors
    document.getElementById('fname_error').innerText = '';
    document.getElementById('lname_error').innerText = '';
    document.getElementById('username_error').innerText = '';
    document.getElementById('password_error').innerText = '';
    document.getElementById('email_error').innerText = '';
    document.getElementById('contact_error').innerText = '';
    document.getElementById('success_error').innerText = '';

    // Get form values
    var fname = document.getElementById('fname').value.trim();
    var lname = document.getElementById('lname').value.trim();
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();
    var email = document.getElementById('email').value.trim();
    var contact = document.getElementById('contact').value.trim();

    var valid = true;

    if (fname === '') {
        document.getElementById('fname_error').innerText = 'First name is required';
        valid = false;
    }
    if (lname === '') {
        document.getElementById('lname_error').innerText = 'Last name is required';
        valid = false;
    }
    if (username === '') {
        document.getElementById('username_error').innerText = 'username is required';
        valid = false;
    }
        if (password === '') {
        document.getElementById('password_error').innerText = 'Password is required';
        valid = false;
        }
    if (email === '') {
        document.getElementById('email_error').innerText = 'Email is required';
        valid = false;
    }
    
    if (!/^\d{10}$/.test(contact)) {
        document.getElementById('contact_error').innerText = 'Contact must be exactly 10 digits';
        valid = false;
    }

    if (valid) {
        document.getElementById('success_error').innerText = 'Successfully registered!';
    }

    return false;
}
</script>
