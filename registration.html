```
<!-- Heading -->
<div class="container mt-4 mb-4 border p-4">
    <h4 class="text-center text-success">
        Student Registration Form
    </h4>
</div>

<!-- Form -->
<form id="myform" class="container">

    <!-- First Name -->
    <div class="mb-4">
        <label for="fname" class="form-label">First Name</label>
        <input type="text" class="form-control" id="fname"
            placeholder="Enter your first name">
        <p id="fname_error" class="text-danger"></p>
    </div>

    <!-- Last Name -->
    <div class="mb-4">
        <label for="lname" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lname"
            placeholder="Enter your last name">
        <p id="lname_error" class="text-danger"></p>
    </div>

    <!-- Username -->
    <div class="mb-4">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username"
            placeholder="b241267">
        <p id="username_error" class="text-danger"></p>
    </div>

    <!-- Password -->
    <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control w-50" id="password"
            placeholder="Enter your password">
        <p id="password_error" class="text-danger"></p>
    </div>

    <!-- Email -->
    <div class="mb-4">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email"
            placeholder="Enter your email">
        <p id="email_error" class="text-danger"></p>
    </div>

    <!-- Contact -->
    <div class="mb-4">
        <label for="contact" class="form-label">Contact</label>
        <input type="text" class="form-control" id="contact"
            placeholder="Enter 10 digit contact number">
        <p id="contact_error" class="text-danger"></p>
    </div>

    <!-- Submit -->
    <div class="mb-4">
        <button type="button"
            class="btn btn-success w-100"
            onclick="studentregistration()">
            Submit
        </button>

        <div class="alert alert-success mt-3">
            <p id="success_error" class="mb-0"></p>
        </div>
    </div>

</form>

<!-- JavaScript Validation -->
<script>

    function studentregistration() {

        // Clear previous errors
        document.getElementById('fname_error').innerText = '';
        document.getElementById('lname_error').innerText = '';
        document.getElementById('username_error').innerText = '';
        document.getElementById('password_error').innerText = '';
        document.getElementById('email_error').innerText = '';
        document.getElementById('contact_error').innerText = '';
        document.getElementById('success_error').innerText = '';

        // Get values
        var fname = document.getElementById('fname').value.trim();
        var lname = document.getElementById('lname').value.trim();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value.trim();
        var email = document.getElementById('email').value.trim();
        var contact = document.getElementById('contact').value.trim();

        var valid = true;


        // First Name validation
        if (fname === '') {
            document.getElementById('fname_error').innerText =
                'First name is required';

            valid = false;
        }


        // Last Name validation
        if (lname === '') {
            document.getElementById('lname_error').innerText =
                'Last name is required';

            valid = false;
        }


        // Username validation
        if (username === '') {
            document.getElementById('username_error').innerText =
                'Username is required';

            valid = false;
        }


        // Password validation
        if (password === '') {
            document.getElementById('password_error').innerText =
                'Password is required';

            valid = false;
        }


        // Email validation
        if (email === '') {

            document.getElementById('email_error').innerText =
                'Email is required';

            valid = false;

        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {

            document.getElementById('email_error').innerText =
                'Enter a valid email';

            valid = false;
        }


        // Contact validation
        if (contact === '') {

            document.getElementById('contact_error').innerText =
                'Contact is required';

            valid = false;

        } else if (!/^\d{10}$/.test(contact)) {

            document.getElementById('contact_error').innerText =
                'Contact must be exactly 10 digits';

            valid = false;
        }


        // Success
        if (valid) {

            document.getElementById('success_error').innerText =
                'Successfully registered!';
        }

        return false;
    }

</script>
