<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>


<div class="container mt-5 mb-5">

    <h2 class="text-center text-success">
        Student Registration Form
    </h2>


    <form id="signupForm" class="mt-4">


        <!-- First Name -->

        <div class="mb-3">

            <label>First Name</label>

            <input
                type="text"
                class="form-control"
                id="fname"
                placeholder="Enter first name">

            <p id="fname_error"
               class="text-danger"></p>

        </div>


        <!-- Last Name -->

        <div class="mb-3">

            <label>Last Name</label>

            <input
                type="text"
                class="form-control"
                id="lname"
                placeholder="Enter last name">

            <p id="lname_error"
               class="text-danger"></p>

        </div>


        <!-- Username -->

        <div class="mb-3">

            <label>Username</label>

            <input
                type="text"
                class="form-control"
                id="username"
                placeholder="Enter username">

            <p id="username_error"
               class="text-danger"></p>

        </div>


        <!-- Password -->

        <div class="mb-3">

            <label>Password</label>

            <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter password">

            <p id="password_error"
               class="text-danger"></p>

        </div>


        <!-- Confirm Password -->

        <div class="mb-3">

            <label>Confirm Password</label>

            <input
                type="password"
                class="form-control"
                id="cpassword"
                placeholder="Confirm password">

            <p id="cpassword_error"
               class="text-danger"></p>

        </div>


        <!-- Email -->

        <div class="mb-3">

            <label>Email</label>

            <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter email">

            <p id="email_error"
               class="text-danger"></p>

        </div>


        <!-- Contact -->

        <div class="mb-3">

            <label>Contact</label>

            <input
                type="text"
                class="form-control"
                id="contact"
                placeholder="Enter 10 digit contact">

            <p id="contact_error"
               class="text-danger"></p>

        </div>


        <!-- Message -->

        <div
            id="message"
            class="alert"
            style="display:none;">
        </div>


        <button
            type="submit"
            class="btn btn-success w-100">

            Register

        </button>


        <div class="text-center mt-3">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


    </form>

</div>


<!-- JavaScript -->

<script src="js/signup.js"></script>


</body>

</html>
