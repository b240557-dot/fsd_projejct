<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>


<div class="container mt-5">

    <h2>Login</h2>


    <div
        id="message"
        class="alert"
        style="display:none;">
    </div>


    <form id="loginForm">


        <!-- Username -->

        <div class="mb-3">

            <label>Username</label>

            <input
                type="text"
                class="form-control"
                id="username"
                placeholder="Enter username">

        </div>


        <!-- Password -->

        <div class="mb-3">

            <label>Password</label>

            <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter password">

        </div>


        <button
            type="submit"
            class="btn btn-primary">

            Login

        </button>


        <a
            href="signup.html"
            class="btn btn-secondary">

            Sign up

        </a>


    </form>

</div>


<script src="js/login.js"></script>


</body>

</html>
